# Local development and, later, the single VM: the same file in both places.
#   docker compose up -d db storage             database and file storage; run the API with `dotnet watch`
#   docker compose --profile full up -d --build database, file storage and API together
name: fitit

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitit}
      POSTGRES_USER: ${POSTGRES_USER:-fitit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitit}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fitit_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # File storage that speaks the S3 protocol, standing in for Cloudflare R2 on a developer's machine.
  # Photos go from the phone straight here, so a real phone needs STORAGE_BIND=0.0.0.0 and
  # Storage__PublicEndpoint=http://<this computer's address>:9000 on the API. The simulator reaches it as localhost.
  storage:
    image: versity/versitygw:v1.8.0
    restart: unless-stopped
    # Object metadata is kept in /meta, so /data needs no extended attributes from the volume's filesystem.
    command: ["posix", "--sidecar", "/meta", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-fitit-local}
      ROOT_SECRET_KEY: ${STORAGE_SECRET_KEY:-fitit-local-secret}
    ports:
      - "${STORAGE_BIND:-127.0.0.1}:${STORAGE_PORT:-9000}:7070"
    volumes:
      - fitit_files:/data
      - fitit_files_meta:/meta

  api:
    profiles: ["full"]
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Database: Host=db;Port=5432;Database=${POSTGRES_DB:-fitit};Username=${POSTGRES_USER:-fitit};Password=${POSTGRES_PASSWORD:-fitit}
      Database__MigrateOnStartup: "true"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-}
      App__PublicBaseUrl: ${PUBLIC_BASE_URL:-}
      # The API reaches storage by its service name; phones need an address they can open.
      Storage__Endpoint: http://storage:7070
      Storage__PublicEndpoint: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
      Storage__Region: us-east-1
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:-fitit-local}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:-fitit-local-secret}
      Storage__CreateBucket: "true"
    ports:
      - "${API_PORT:-5080}:5080"
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started

volumes:
  fitit_pgdata:
  fitit_files:
  fitit_files_meta:
