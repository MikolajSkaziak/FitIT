name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore backend/FitIt.slnx
      - name: Build (warnings are errors)
        run: dotnet build backend/FitIt.slnx --no-restore --configuration Release
      # Integration tests start PostgreSQL in a container; the runner has Docker.
      - name: Test
        run: dotnet test backend/FitIt.slnx --no-build --configuration Release

  api-image:
    name: API image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build --tag fitit-api:ci backend

  mobile:
    name: App (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint -- --max-warnings 0
      - name: Types
        run: npm run typecheck
      - name: Test
        run: npm test -- --ci
