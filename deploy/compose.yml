# FitIt on a single small Linux VM (1-2 GB of memory).
#
#   Caddy (80/443, automatic HTTPS)  ->  API (.NET, internal port 5080)  ->  PostgreSQL 18
#   Photos never pass through the API: phones upload straight to Cloudflare R2.
#
# Only Caddy publishes ports. The API and the database are reachable on the internal Docker networks only.
# Every secret and every address comes from an env file kept OUTSIDE the repository (see .env.example and README.md):
#
#   docker compose --env-file /etc/fitit/fitit.env -f deploy/compose.yml up -d --build
#
# (server-setup.sh exports COMPOSE_FILE and COMPOSE_ENV_FILES for login shells, so plain `docker compose ...` works there.)
name: fitit-prod

# Container logs are rotated: at most 3 files of 10 MB per service, so logs can never fill a small disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fitit}
      POSTGRES_USER: ${POSTGRES_USER:-fitit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in the env file}
    # Settings for about 512 MB of memory for the database. Raise shared_buffers and effective_cache_size on a bigger VM.
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - max_connections=40
    shm_size: 128mb
    volumes:
      # PostgreSQL 18 keeps its data in a versioned directory below /var/lib/postgresql, so the volume is mounted there.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    networks: [data]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512m
    security_opt: ["no-new-privileges:true"]

  api:
    build:
      context: ../backend
    image: fitit-api:current
    restart: unless-stopped
    logging: *default-logging
    # backend/Dockerfile ends with USER $APP_UID (1654), so the process is not root.
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Behind Caddy the API must see the visitor's address and scheme (X-Forwarded-For/-Proto), otherwise the per-address
      # rate limit on /api/auth sees only Caddy. Safe here: only Caddy can reach the API (internal network).
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

      ConnectionStrings__Database: Host=db;Port=5432;Database=${POSTGRES_DB:-fitit};Username=${POSTGRES_USER:-fitit};Password=${POSTGRES_PASSWORD};Maximum Pool Size=20
      # The API applies EF Core migrations when it starts. With one VM and one API instance that is the simplest safe choice.
      Database__MigrateOnStartup: ${DATABASE_MIGRATE_ON_STARTUP:-true}

      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in the env file}
      App__PublicBaseUrl: https://${DOMAIN:?DOMAIN must be set in the env file}
      App__TimeZone: ${APP_TIMEZONE:-Europe/Warsaw}

      # Cloudflare R2. The bucket is created by hand once, so the API never creates it.
      Storage__Endpoint: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT must be set in the env file}
      Storage__Bucket: ${STORAGE_BUCKET:-fitit-files}
      Storage__Region: auto
      Storage__AccessKey: ${STORAGE_ACCESS_KEY:?STORAGE_ACCESS_KEY must be set in the env file}
      Storage__SecretKey: ${STORAGE_SECRET_KEY:?STORAGE_SECRET_KEY must be set in the env file}
      Storage__CreateBucket: "false"

      Providers__LocationSearch: ${PROVIDER_LOCATION_SEARCH:-OpenMeteo}
      Providers__Weather: ${PROVIDER_WEATHER:-OpenMeteo}
      Providers__ImageStorage: S3
      Providers__BackgroundRemover: ${PROVIDER_BACKGROUND_REMOVER:-Fake}
      Providers__GarmentTagger: ${PROVIDER_GARMENT_TAGGER:-Fake}
      Providers__OutfitStylist: ${PROVIDER_OUTFIT_STYLIST:-Fake}
      Providers__OutfitCritic: ${PROVIDER_OUTFIT_CRITIC:-Fake}
      Providers__ColorAnalyst: ${PROVIDER_COLOR_ANALYST:-Fake}
      Providers__OutfitVisualizer: ${PROVIDER_OUTFIT_VISUALIZER:-Fake}
      # Provider keys come from the env file only. The API refuses to start when a provider is "Gemini" or "Fal" and its key is empty.
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Fal__ApiKey: ${FAL_API_KEY:-}
      Providers__AllowFakesInProduction: ${ALLOW_FAKES_IN_PRODUCTION:-false}

      # Defaults below equal backend/src/FitIt.Api/appsettings.json.
      Limits__ItemsPerDay: ${LIMIT_ITEMS_PER_DAY:-50}
      Limits__SuggestionsPerDay: ${LIMIT_SUGGESTIONS_PER_DAY:-20}
      Limits__VisualizationsPerDay: ${LIMIT_VISUALIZATIONS_PER_DAY:-5}
      Limits__AiBudgetUsdPerDay: ${LIMIT_AI_BUDGET_USD_PER_DAY:-10}
      RateLimits__AuthPerMinute: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}

      # The jobs dashboard (/hangfire) exists only when both are non-empty. Caddy hides it from the internet anyway.
      Hangfire__DashboardUser: ${HANGFIRE_DASHBOARD_USER:-}
      Hangfire__DashboardPassword: ${HANGFIRE_DASHBOARD_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The runtime image has no curl or wget; bash can open a TCP connection by itself.
      test:
        - CMD-SHELL
        - |
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/5080; printf "GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3; head -n 1 <&3 | grep -q " 200 "'
      interval: 30s
      timeout: 5s
      retries: 3
      # Migrations run before the server starts listening.
      start_period: 60s
    networks: [edge, data]
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set in the env file}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set in the env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./legal:/srv/legal:ro
      # Certificates and the ACME account: losing this volume means asking for new certificates (rate limits apply).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
    networks: [edge]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]

networks:
  # Caddy <-> API.
  edge:
  # API <-> database. Internal: containers on it have no route to the outside, so the database cannot call out.
  data:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
